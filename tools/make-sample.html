<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ScreenSafe · sample recording generator</title>
    <style>
      body {
        background: #0b0d13;
        color: #e6e9ef;
        font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 24px;
      }
      h1 { font-size: 17px; margin: 0 0 4px; }
      p { color: #8b93a7; margin: 0 0 18px; }
      canvas { width: 640px; border: 1px solid #232939; border-radius: 8px; display: block; margin-bottom: 14px; }
      button {
        background: #5b8cff; border: 0; color: #06121f; font: inherit; font-weight: 600;
        padding: 9px 18px; border-radius: 8px; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      #log { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #9aa3b8; white-space: pre-wrap; margin-top: 14px; }
    </style>
  </head>
  <body>
    <h1>Sample recording generator</h1>
    <p>
      Renders the bundled demo — a careless screen recording full of planted credentials — and writes it to
      <code>public/sample/leaky-demo.mp4</code>. Dev only.
    </p>
    <canvas id="c" width="1280" height="720"></canvas>
    <button id="go">Generate &amp; save</button>
    <div id="log"></div>

    <script type="module">
      import { Muxer, ArrayBufferTarget } from 'mp4-muxer';

      const W = 1280, H = 720, FPS = 30, DUR = 22;
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d', { alpha: false });
      const log = (m) => (document.getElementById('log').textContent += m + '\n');

      const BG = '#0d1117', PANEL = '#161b22', LINE = '#21262d';
      const FG = '#d5dbe5', DIM = '#7d8899', GREEN = '#7ee787', ORANGE = '#ffa657', BLUE = '#79c0ff', RED = '#ff7b72';
      const MONO = '600 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
      const UI = '15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';

      // Keep the demo credentials synthetic at runtime so repository secret
      // scanners do not mistake the planted fixtures for usable credentials.
      const synthetic = (...parts) => parts.join('');
      const SAMPLE = {
        stripeLive: synthetic('sk', '_live_', '51QjsAbCdEfGhIjKlMnOpQrSt9Gh'),
        database: synthetic('postgres', '://admin:hunter2pass@db.prod.internal:5432/app'),
        sendgrid: synthetic('S', 'G.aBcDeFgHiJkLmNoP', '.', 'qRsTuVwXyZ0123456789abcd'),
        openai: synthetic('sk', '-proj-', 'abc123XYZdef456GHIjkl789MNOpqr'),
        awsId: synthetic('A', 'KIAIOSFODNN7EXAMPLE'),
        awsSecret: synthetic('wJalrXUtnFEMI', '/K7MDENG/bPxRfiCYEXAMPLEKEY'),
        jwt: synthetic('e', 'yJhbGciOiJIUzI1NiJ9', '.', 'eyJzdWIiOiIxMjM0NSJ9', '.', 'dBjftJeZ4CVPmB92K27u'),
      };

      function chrome(title) {
        ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = PANEL; ctx.fillRect(0, 0, W, 42);
        ctx.strokeStyle = LINE; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, 42.5); ctx.lineTo(W, 42.5); ctx.stroke();
        const dots = ['#ff5f56', '#ffbd2e', '#27c93f'];
        dots.forEach((c, i) => {
          ctx.fillStyle = c; ctx.beginPath(); ctx.arc(24 + i * 20, 21, 6, 0, 7); ctx.fill();
        });
        ctx.fillStyle = DIM; ctx.font = UI; ctx.textAlign = 'center';
        ctx.fillText(title, W / 2, 27); ctx.textAlign = 'left';
      }

      /** Draws monospace lines with simple token colouring. */
      function lines(rows, x, y, reveal, lh = 30) {
        ctx.font = MONO; ctx.textBaseline = 'alphabetic';
        rows.slice(0, reveal).forEach((row, i) => {
          const yy = y + i * lh;
          let cx = x;
          for (const [text, color] of row) {
            ctx.fillStyle = color;
            ctx.fillText(text, cx, yy);
            cx += ctx.measureText(text).width;
          }
        });
      }

      const K = (s) => [s, ORANGE];   // key name
      const V = (s) => [s, GREEN];    // secret value
      const T = (s) => [s, FG];       // plain
      const D = (s) => [s, DIM];      // dim
      const P = (s) => [s, BLUE];     // prompt / punctuation

      /* ------------------------------------------------------------ scenes */

      function sceneTerminalEnv(lt) {
        chrome('marco@studio — zsh — 120×32');
        const typed = 'cat .env'.slice(0, Math.max(0, Math.floor((lt - 0.2) / 0.09)));
        const rows = [[P('$ '), T(typed + (lt % 0.9 < 0.45 && lt < 1.2 ? '▋' : ''))]];
        const reveal = lt < 1.3 ? 1 : 1 + Math.floor((lt - 1.3) / 0.5);
        const body = [
          [K('STRIPE_SECRET_KEY'), T('='), V(SAMPLE.stripeLive)],
          [K('DATABASE_URL'), T('='), V(SAMPLE.database)],
          [K('SENDGRID_API_KEY'), T('='), V(SAMPLE.sendgrid)],
          [K('NEXT_PUBLIC_APP_URL'), T('='), T('https://myapp.dev')],
          [P('$ '), T(lt > 5 ? 'npm run deploy' : '')],
        ];
        lines([...rows, ...body.slice(0, Math.max(0, reveal - 1))], 40, 96, 99);
      }

      function sceneEditor(lt) {
        chrome('config.ts — myapp');
        ctx.fillStyle = PANEL; ctx.fillRect(0, 43, 210, H - 43);
        ctx.strokeStyle = LINE; ctx.beginPath(); ctx.moveTo(210.5, 43); ctx.lineTo(210.5, H); ctx.stroke();
        ctx.font = UI; ctx.fillStyle = DIM;
        ['src', '  api', '  lib', '  config.ts', '  index.ts', 'package.json'].forEach((f, i) => {
          if (f.trim() === 'config.ts') { ctx.fillStyle = FG; } else { ctx.fillStyle = DIM; }
          ctx.fillText(f, 24, 82 + i * 26);
        });
        const rows = [
          [D(' 1  '), P('import'), T(' { OpenAI } '), P('from'), V(' "openai"'), T(';')],
          [D(' 2  ')],
          [D(' 3  '), D('// keep sensitive config out of source files')],
          [D(' 4  '), P('const'), K(' OPENAI_KEY'), T(' = '), V('"' + SAMPLE.openai + '"'), T(';')],
          [D(' 5  '), P('const'), K(' SUPPORT_EMAIL'), T(' = '), V('"marco.nunes@gmail.com"'), T(';')],
          [D(' 6  '), P('const'), K(' SUPPORT_PHONE'), T(' = '), V('"(314) 555-0192"'), T(';')],
          [D(' 7  ')],
          [D(' 8  '), P('export const'), T(' client = '), P('new'), T(' OpenAI({ apiKey: OPENAI_KEY });')],
        ];
        const reveal = Math.min(rows.length, 3 + Math.floor(lt / 0.42));
        lines(rows, 240, 96, reveal);
        if (lt > 4.2) {
          ctx.fillStyle = 'rgba(255,123,114,0.12)';
          ctx.fillRect(236, 175, W - 270, 30);
        }
      }

      function sceneBilling(lt) {
        chrome('Billing — Acme Dashboard');
        ctx.fillStyle = '#11151d'; ctx.fillRect(0, 43, W, H - 43);
        const cardX = 240, cardY = 120, cardW = 800, cardH = 420;
        ctx.fillStyle = PANEL;
        ctx.strokeStyle = LINE;
        ctx.beginPath(); ctx.roundRect(cardX, cardY, cardW, cardH, 12); ctx.fill(); ctx.stroke();

        ctx.font = '600 22px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillStyle = FG; ctx.fillText('Payment method', cardX + 40, cardY + 58);

        const rows = [
          ['Card number', '4242 4242 4242 4242'],
          ['Expires', '12 / 28'],
          ['Billing email', 'marco.nunes@gmail.com'],
          ['Phone', '(314) 555-0192'],
          ['Account ID', 'acct_1QjsAbCdEfGhIjKl'],
        ];
        const reveal = Math.min(rows.length, 1 + Math.floor(lt / 0.5));
        rows.slice(0, reveal).forEach(([k, v], i) => {
          const y = cardY + 118 + i * 62;
          ctx.font = UI; ctx.fillStyle = DIM; ctx.fillText(k, cardX + 40, y);
          ctx.font = MONO; ctx.fillStyle = FG; ctx.fillText(v, cardX + 300, y);
          ctx.strokeStyle = LINE;
          ctx.beginPath(); ctx.moveTo(cardX + 40, y + 20.5); ctx.lineTo(cardX + cardW - 40, y + 20.5); ctx.stroke();
        });
      }

      function sceneTerminalAws(lt) {
        chrome('marco@studio — zsh — 120×32');
        const rows = [
          [P('$ '), T('aws configure list')],
          [K('AWS_ACCESS_KEY_ID'), T('='), V(SAMPLE.awsId)],
          [K('aws_secret_access_key'), T('='), V(SAMPLE.awsSecret)],
          [P('$ '), T('curl -H '), V('"Authorization: Bearer ' + SAMPLE.jwt + '"')],
          [D('  → 200 OK')],
          [T('deployed to '), V('203.0.113.42')],
          [P('$ ')],
        ];
        const reveal = Math.min(rows.length, 1 + Math.floor(lt / 0.55));
        lines(rows, 40, 96, reveal);
      }

      const SCENES = [
        [0, 6, sceneTerminalEnv],
        [6, 12, sceneEditor],
        [12, 17, sceneBilling],
        [17, 22, sceneTerminalAws],
      ];

      function renderAt(t) {
        const scene = SCENES.find(([a, b]) => t >= a && t < b) ?? SCENES[SCENES.length - 1];
        scene[2](t - scene[0]);
      }

      /* ------------------------------------------------------------- audio */

      function buildAudio(sampleRate) {
        const len = Math.floor(DUR * sampleRate);
        const left = new Float32Array(len);
        const right = new Float32Array(len);
        for (let i = 0; i < len; i++) {
          const t = i / sampleRate;
          const scene = SCENES.findIndex(([a, b]) => t >= a && t < b);
          const freq = [196, 233, 262, 220][Math.max(0, scene)];
          const env = 0.045 * Math.min(1, t * 2) * Math.min(1, (DUR - t) * 2);
          const v = Math.sin(2 * Math.PI * freq * t) * env + Math.sin(2 * Math.PI * freq * 2 * t) * env * 0.25;
          left[i] = v;
          right[i] = v * 0.92;
        }
        return { left, right };
      }

      /* ------------------------------------------------------------ encode */

      document.getElementById('go').onclick = async () => {
        const btn = document.getElementById('go');
        btn.disabled = true;
        try {
          const sampleRate = 48000;
          const target = new ArrayBufferTarget();
          const muxer = new Muxer({
            target,
            fastStart: 'in-memory',
            video: { codec: 'avc', width: W, height: H, frameRate: FPS },
            audio: { codec: 'aac', numberOfChannels: 2, sampleRate },
          });

          log('encoding audio…');
          const aenc = new AudioEncoder({
            output: (c, m) => muxer.addAudioChunk(c, m),
            error: (e) => log('audio error: ' + e),
          });
          aenc.configure({ codec: 'mp4a.40.2', sampleRate, numberOfChannels: 2, bitrate: 96000 });
          const { left, right } = buildAudio(sampleRate);
          const CH = 8192;
          for (let off = 0; off < left.length; off += CH) {
            const n = Math.min(CH, left.length - off);
            const planar = new Float32Array(n * 2);
            planar.set(left.subarray(off, off + n), 0);
            planar.set(right.subarray(off, off + n), n);
            const ad = new AudioData({
              format: 'f32-planar', sampleRate, numberOfFrames: n, numberOfChannels: 2,
              timestamp: Math.round((off / sampleRate) * 1e6), data: planar,
            });
            aenc.encode(ad); ad.close();
          }
          await aenc.flush(); aenc.close();

          log('encoding video…');
          const venc = new VideoEncoder({
            output: (c, m) => muxer.addVideoChunk(c, m),
            error: (e) => log('video error: ' + e),
          });
          venc.configure({ codec: 'avc1.640028', width: W, height: H, bitrate: 1_400_000, framerate: FPS });

          const total = DUR * FPS;
          for (let i = 0; i < total; i++) {
            const t = i / FPS;
            renderAt(t);
            const frame = new VideoFrame(canvas, { timestamp: Math.round(t * 1e6), duration: Math.round(1e6 / FPS) });
            venc.encode(frame, { keyFrame: i % (FPS * 2) === 0 });
            frame.close();
            if (venc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 0));
            if (i % 60 === 0) log(`  frame ${i}/${total}`);
          }
          await venc.flush(); venc.close();
          muxer.finalize();

          const bytes = target.buffer;
          log(`muxed ${(bytes.byteLength / 1e6).toFixed(2)} MB — saving…`);
          const res = await fetch('/__save-sample?name=leaky-demo.mp4', { method: 'POST', body: bytes });
          const json = await res.json();
          log('saved → ' + json.path);
          window.__sampleDone = { ok: true, bytes: json.bytes };
        } catch (err) {
          log('FAILED: ' + (err?.message ?? err));
          window.__sampleDone = { ok: false, error: String(err) };
        } finally {
          btn.disabled = false;
        }
      };

      renderAt(3);
    </script>
  </body>
</html>
